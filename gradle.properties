org.gradle.jvmargs=-Xmx2G
# off because loom's include-from-file task cannot be serialised into the config cache
org.gradle.configuration-cache=false

# Fabric Properties (https://fabricmc.net/develop)
# 26.x ships unobfuscated, so there is no yarn and no real intermediary.
# mappings come from loom.officialMojangMappings().
minecraft_version=26.2
loader_version=0.19.3
fabric_api_version=0.155.2+26.1.2

# meteor publishes 26.1.2 but baritone only publishes 26.1, so these cannot share a property
meteor_version=26.2
baritone_version=26.2

# Mod Properties
mod_version=26.2-n-17.2
maven_group=com.nnpg
archives_base_name=glazed
mod_name=Glazed
spotify_api_version=1.4.7
